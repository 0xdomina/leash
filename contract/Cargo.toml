[package]
name = "leash"
version = "0.1.0"
edition = "2021"
description = "Leash: on-chain spending guardrails for autonomous agent keys on NEAR"
license = "MIT"
repository = "https://github.com/0xdfinity/Leash"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.5.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
